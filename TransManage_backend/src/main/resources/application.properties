spring.application.name=TransManage

ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.review.max-requests=${AI_REVIEW_MAX_REQUESTS:30}
ai.review.window-seconds=${AI_REVIEW_WINDOW_SECONDS:60}

spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Hibernate manages the development schema; seed data is not replayed on restart.
spring.sql.init.mode=never
spring.sql.init.platform=postgresql
spring.datasource.initialization-mode=always
spring.jpa.defer-datasource-initialization=true
